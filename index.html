<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misterio en el Midnight Express</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="audios/tren_ambiente.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay">
        <h1 id="title">MISTERIO EN EL MIDNIGHT EXPRESS</h1>
        <div id="gameContent">
            <p id="text">
                Un asesinato ocurrió durante el viaje... <br>
                El tren se detendrá pronto. Encuentra al culpable antes de llegar a la estación.
            </p>
            <button id="startButton">INICIAR INVESTIGACIÓN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
